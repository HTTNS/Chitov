      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
 
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
 
      - name: Build the APK
        run: gradle assembleRelease -PversionCode=${{ github.run_number }} --stacktrace
 
      - name: Publish download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk chitov.apk
          gh release create "v${{ github.run_number }}" chitov.apk \
            --repo "${{ github.repository }}" \
            --title "יומן חיטוב – גרסה ${{ github.run_number }}" \
            --notes "להורדה בטלפון: לחצי על chitov.apk והתקיני." \
            --latest
 
